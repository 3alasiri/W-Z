<title>بقالتي الذكية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* تخطيط: شريط تنقل جانبي ثابت + مساحة عمل، يتحول لشريط علوي قابل للتمرير على الجوال */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#1b2a22; --muted:#61706a; --line:#dfe5de;
  --brand:#1f6b4a; --brand-ink:#ffffff; --brand-soft:#e2efe7; --accent:#e0a526;
  --ok:#2f8a57; --warn:#c9861a; --bad:#c2413b; --ok-bg:#e3f3e9; --warn-bg:#fbf0d9; --bad-bg:#f8e3e1;
  --side:#173a2b; --side-ink:#d6e6dc;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111814; --panel:#18221d; --ink:#e4ece6; --muted:#97a69e; --line:#2a3832;
  --brand:#3fa576; --brand-ink:#0d1a13; --brand-soft:#1e3328; --accent:#e8b545;
  --ok:#5cc28a; --warn:#e7aa48; --bad:#ec706a; --ok-bg:#183326; --warn-bg:#352a14; --bad-bg:#3a1d1b;
  --side:#0c130f; --side-ink:#b9cdc1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --panel:#18221d; --ink:#e4ece6; --muted:#97a69e; --line:#2a3832;
  --brand:#3fa576; --brand-ink:#0d1a13; --brand-soft:#1e3328; --accent:#e8b545;
  --ok:#5cc28a; --warn:#e7aa48; --bad:#ec706a; --ok-bg:#183326; --warn-bg:#352a14; --bad-bg:#3a1d1b;
  --side:#0c130f; --side-ink:#b9cdc1; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;direction:rtl}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav{background:var(--side);color:var(--side-ink);padding-block:20px;padding-inline:12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{font-family:var(--f-display);font-size:20px;font-weight:700;color:#fff;padding:4px 10px 16px;display:flex;gap:8px;align-items:center}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:inline-grid;place-items:center;color:#173a2b;font-style:normal;font-size:15px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
nav button:focus-visible{outline:2px solid var(--accent)}
.badge{background:var(--bad);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:600}
.store{margin-top:auto;font-size:12px;opacity:.75;padding:10px}
main{padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-size:24px;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-family:var(--f-display);font-size:24px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:4px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.btn{all:unset;cursor:pointer;background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;text-align:center}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--brand-soft);color:var(--brand)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;flex-wrap:wrap}
.row .t{font-weight:600}.row .s{color:var(--muted);font-size:12px}
.sev{border-inline-start:4px solid var(--line)}
.sev.bad{border-inline-start-color:var(--bad)}.sev.warn{border-inline-start-color:var(--warn)}.sev.info{border-inline-start-color:var(--brand)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.scan{display:flex;gap:8px}
.scan input{flex:1;font-family:ui-monospace,monospace;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;background:var(--panel)}
.chip:hover{border-color:var(--brand)}
.chip b{display:block;font-size:13px}
.total{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.total.big{font-family:var(--f-display);font-size:20px;border-top:1px dashed var(--line);padding-top:10px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--brand-soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col h3{margin:0;font-size:13px;display:flex;justify-content:space-between}
.oc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.oc .s{color:var(--muted);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar span{display:block;width:100%;background:var(--brand);border-radius:6px 6px 0 0;min-height:2px}
.bar.f span{background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 4px,transparent 4px,transparent 8px);border:1px solid var(--accent)}
.bar small{font-size:11px;color:var(--muted)}
.bar em{font-style:normal;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--brand);margin-inline-end:4px}
.legend i.f{background:var(--accent)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding:4px}
.msg{max-width:80%;padding:10px 12px;border-radius:12px;line-height:1.7}
.msg.u{align-self:flex-start;background:var(--brand);color:var(--brand-ink)}
.msg.a{align-self:flex-end;background:var(--brand-soft)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:calc(20px + env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:none}
.phone{max-width:340px;margin:0 auto;border:8px solid var(--side);border-radius:30px;overflow:hidden;background:var(--bg)}
.phone .top{background:var(--brand);color:var(--brand-ink);padding:14px}
.phone .body{padding:12px;display:flex;flex-direction:column;gap:10px}
.prod{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prod div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;display:flex;flex-direction:column;gap:6px}
.meter{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.meter span{display:block;height:100%;background:var(--brand)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav{flex-direction:row;overflow-x:auto;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-inline:max(8px,env(safe-area-inset-left,0px))}
  .logo,.store{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:1fr}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav id="nav">
    <div class="logo"><i>ب</i>بقالتي الذكية</div>
  </nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
const TODAY=new Date('2026-11-23');
const dPlus=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysTo=s=>Math.round((new Date(s)-TODAY)/864e5);
const SAR=n=>n.toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ر.س';
const N=n=>n.toLocaleString('ar-SA');

// بيانات تجريبية
const S={
 products:[
  {bc:'6281007031129',name:'حليب طازج كامل الدسم 1 لتر',cat:'ألبان',stock:8,cost:4.2,price:6,exp:dPlus(3),sup:'المراعي',daily:14,lead:1},
  {bc:'6281007032003',name:'لبن 2 لتر',cat:'ألبان',stock:22,cost:7,price:9.5,exp:dPlus(9),sup:'المراعي',daily:6,lead:1},
  {bc:'6281100050012',name:'خبز توست أبيض',cat:'مخبوزات',stock:5,cost:3.1,price:4.5,exp:dPlus(2),sup:'مخابز الحي',daily:18,lead:1},
  {bc:'6281006411304',name:'بيض طازج 30 حبة',cat:'ألبان',stock:12,cost:17,price:22,exp:dPlus(16),sup:'مزارع الوطنية',daily:5,lead:2},
  {bc:'6281036001237',name:'أرز بسمتي 5 كجم',cat:'مواد غذائية',stock:30,cost:38,price:49,exp:dPlus(320),sup:'موزع الجملة',daily:2,lead:3},
  {bc:'6281036102114',name:'زيت دوار الشمس 1.5 لتر',cat:'مواد غذائية',stock:4,cost:13,price:17.5,exp:dPlus(200),sup:'موزع الجملة',daily:2.5,lead:3},
  {bc:'6281001214337',name:'مياه معبأة 330 مل × 40',cat:'مشروبات',stock:15,cost:14,price:19,exp:dPlus(400),sup:'نوفا',daily:7,lead:2},
  {bc:'6281043020113',name:'زبادي 170 جم',cat:'ألبان',stock:40,cost:0.9,price:1.5,exp:dPlus(6),sup:'المراعي',daily:9,lead:1},
  {bc:'6281105830024',name:'جبن شرائح 200 جم',cat:'ألبان',stock:18,cost:6.5,price:9,exp:dPlus(-1),sup:'المراعي',daily:2,lead:1},
  {bc:'6281031254102',name:'شاي أحمر 100 كيس',cat:'مواد غذائية',stock:26,cost:9,price:13,exp:dPlus(500),sup:'موزع الجملة',daily:1.2,lead:3},
  {bc:'6281034001208',name:'منظف أطباق 1 لتر',cat:'منظفات',stock:3,cost:6,price:9,exp:dPlus(700),sup:'موزع الجملة',daily:0.8,lead:3},
  {bc:'6281003030114',name:'دجاج مجمد 1 كجم',cat:'مجمدات',stock:20,cost:14,price:19,exp:dPlus(60),sup:'مزارع الوطنية',daily:4,lead:2},
 ],
 cart:[],
 orders:[
  {id:1041,cust:'أبو فيصل',addr:'حي النرجس، ش 12',items:6,total:84.5,st:0,eta:'—',pay:'مدى'},
  {id:1040,cust:'سارة م.',addr:'حي النرجس، ش 7',items:3,total:31,st:1,eta:'—',pay:'نقدًا عند الاستلام'},
  {id:1039,cust:'محمد ع.',addr:'حي الياسمين، ش 3',items:11,total:156,st:2,eta:'12 د',pay:'Apple Pay'},
  {id:1038,cust:'نورة ح.',addr:'حي النرجس، ش 20',items:4,total:47,st:3,eta:'تم',pay:'مدى'},
 ],
 pos:[],
 sales:[{d:'الإثنين',v:2840},{d:'الثلاثاء',v:3120},{d:'الأربعاء',v:2960},{d:'الخميس',v:4210},{d:'الجمعة',v:4880},{d:'السبت',v:3650},{d:'الأحد',v:3310}],
 today:1870, nextId:1042, discounted:{}
};
const ST=['جديد','قيد التجهيز','مع المندوب','تم التسليم'];
const Z=1.65;
const rop=p=>Math.ceil(p.daily*p.lead+Z*(p.daily*0.35)*Math.sqrt(p.lead));
const stockState=p=>p.stock<=0?['نفد','p-bad']:p.stock<=rop(p)?['منخفض','p-warn']:['متوفر','p-ok'];
const expState=p=>{const d=daysTo(p.exp);return d<0?['منتهي','p-bad']:d<=3?['خلال '+N(d)+' أيام','p-bad']:d<=7?['خلال '+N(d)+' أيام','p-warn']:d<=30?['خلال '+N(d)+' يومًا','p-info']:null};
const low=()=>S.products.filter(p=>p.stock<=rop(p));
const expiring=()=>S.products.filter(p=>daysTo(p.exp)<=7).sort((a,b)=>daysTo(a.exp)-daysTo(b.exp));
const findBC=bc=>S.products.find(p=>p.bc===bc.trim());
const toast=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)};
const $=s=>document.querySelector(s);

const VIEWS={
dash:{t:'لوحة القيادة',r(){
  const lw=low(),ex=expiring(),open=S.orders.filter(o=>o.st<3).length;
  const inv=S.products.reduce((a,p)=>a+p.stock*p.cost,0);
  const mx=Math.max(...S.sales.map(s=>s.v),4500);
  return `
  <div class="head"><div><h1>صباح الخير، أبو خالد</h1><div class="sub">الأحد 23 نوفمبر 2026 · فرع حي النرجس</div></div>
  <button class="btn" onclick="go('pos')">فتح نقطة البيع</button></div>
  <div class="grid g4">
   <div class="card kpi"><div class="l">مبيعات اليوم</div><div class="v">${SAR(S.today)}</div><div class="d up">▲ 8٪ عن الأحد الماضي</div></div>
   <div class="card kpi"><div class="l">صافي الربح التقديري</div><div class="v">${SAR(S.today*0.22)}</div><div class="d muted">هامش 22٪</div></div>
   <div class="card kpi"><div class="l">طلبات أونلاين مفتوحة</div><div class="v">${N(open)}</div><div class="d muted">متوسط التجهيز 9 دقائق</div></div>
   <div class="card kpi"><div class="l">قيمة المخزون</div><div class="v">${SAR(inv)}</div><div class="d dn">${N(lw.length)} أصناف تحت حد الطلب</div></div>
  </div>
  <div class="grid g3">
   <div class="card"><h2>المبيعات: آخر 7 أيام وتوقع الأسبوع القادم</h2>
    <div class="bars">${S.sales.map(s=>`<div class="bar"><em>${N(s.v)}</em><span style="height:${s.v/mx*100}%"></span><small>${s.d.slice(0,3)}</small></div>`).join('')}
    ${[3400,3900,3300].map((v,i)=>`<div class="bar f"><em>${N(v)}</em><span style="height:${v/mx*100}%"></span><small>${['إثن','ثلا','أرب'][i]}</small></div>`).join('')}</div>
    <div class="legend"><span><i></i>فعلي</span><span><i class="f"></i>توقع الذكاء الاصطناعي</span></div>
   </div>
   <div class="card"><h2>تنبيهات تحتاج إجراء</h2><div class="list">
    ${ex.slice(0,3).map(p=>`<div class="row sev ${daysTo(p.exp)<=3?'bad':'warn'}"><div><div class="t">${p.name}</div><div class="s">صلاحية: ${expState(p)[0]} · ${N(p.stock)} قطعة</div></div></div>`).join('')}
    ${lw.slice(0,2).map(p=>`<div class="row sev warn"><div><div class="t">${p.name}</div><div class="s">متبقٍ ${N(p.stock)} · نقطة الطلب ${N(rop(p))}</div></div></div>`).join('')}
    <button class="btn ghost sm" onclick="go('alerts')">عرض كل التنبيهات</button></div></div>
  </div>
  <div class="card"><h2>توصيات الذكاء الاصطناعي</h2><div class="list">
   <div class="row sev info"><div><div class="t">جهّز أمر شراء للمراعي الآن</div><div class="s">الحليب والخبز سينفدان قبل ظهر الغد بمعدل البيع الحالي. التوريد يستغرق يومًا واحدًا.</div></div><button class="btn sm" onclick="go('po')">مراجعة الأمر</button></div>
   <div class="row sev info"><div><div class="t">خصم 25٪ على الزبادي قريب الانتهاء</div><div class="s">40 قطعة تنتهي خلال 6 أيام، والبيع المتوقع 32 فقط. الخصم يقلّل الهدر بحوالي 50 ر.س.</div></div><button class="btn sm" onclick="go('alerts')">تطبيق</button></div>
   <div class="row sev info"><div><div class="t">زد مخزون المياه قبل الخميس</div><div class="s">الطلب يرتفع 40٪ نهاية الأسبوع، والطقس المتوقع حار.</div></div></div>
  </div></div>`}},

pos:{t:'نقطة البيع',r(){
  const sub=S.cart.reduce((a,c)=>a+c.p.price*c.q,0);
  return `<div class="head"><div><h1>نقطة البيع</h1><div class="sub">الكاشير: ريم · الوردية الصباحية</div></div></div>
  <div class="grid g3">
   <div class="card"><h2>امسح الباركود أو اختر منتجًا</h2>
    <form class="scan" onsubmit="event.preventDefault();scanPOS()"><input id="posbc" placeholder="مثال: 6281007031129" inputmode="numeric" autocomplete="off"><button class="btn">إضافة</button></form>
    <div class="chips" style="margin-top:12px">${S.products.map(p=>`<button class="chip" onclick="addCart('${p.bc}')"><b>${p.name}</b>${SAR(p.price)}</button>`).join('')}</div>
   </div>
   <div class="card"><h2>الفاتورة</h2>
    ${S.cart.length?`<div class="list">${S.cart.map((c,i)=>`<div class="row"><div><div class="t">${c.p.name}</div><div class="s">${N(c.q)} × ${SAR(c.p.price)}</div></div><div class="chips"><button class="chip" onclick="qty(${i},1)" aria-label="زيادة">+</button><button class="chip" onclick="qty(${i},-1)" aria-label="إنقاص">−</button></div></div>`).join('')}</div>`:'<p class="muted">لا أصناف بعد. امسح أول منتج.</p>'}
    <div class="total"><span>المجموع قبل الضريبة</span><span>${SAR(sub/1.15)}</span></div>
    <div class="total"><span>ضريبة القيمة المضافة 15٪</span><span>${SAR(sub-sub/1.15)}</span></div>
    <div class="total big"><span>الإجمالي</span><span>${SAR(sub)}</span></div>
    <div class="grid g2" style="margin-top:10px"><button class="btn" ${S.cart.length?'':'disabled'} onclick="pay('نقدًا')">دفع نقدًا</button><button class="btn" ${S.cart.length?'':'disabled'} onclick="pay('مدى')">دفع بمدى</button></div>
    <p class="muted" style="font-size:12px">يُصدر إيصال ضريبي برمز QR، ويُخصم المخزون بالأقرب انتهاءً أولًا، ويُسجَّل القيد المحاسبي تلقائيًا.</p>
   </div>
  </div>`}},

inv:{t:'المخزون',r(){

function nav(){const n=$('#nav');n.querySelectorAll('button').forEach(b=>b.remove());const store=n.querySelector('.store');
 Object.entries(VIEWS).forEach(([k,v])=>{const b=document.createElement('button');if(k===cur)b.className='on';const c=v.badge?v.badge():0;b.innerHTML=`<span>${v.t}</span>${c?`<span class="badge">${N(c)}</span>`:''}`;b.onclick=()=>go(k);n.insertBefore(b,store)});}
let cur='dash';
function go(k){cur=VIEWS[k]?k:'dash';try{history.replaceState(null,'','#'+cur)}catch(e){};render();window.scrollTo(0,0)}
function render(){$('#view').innerHTML=VIEWS[cur].r();nav()}

function addCart(bc){const p=findBC(bc);if(!p){toast('باركود غير معروف');return}const c=S.cart.find(c=>c.p===p);c?c.q++:S.cart.push({p,q:1});render();const i=$('#posbc');i&&i.focus()}
function scanPOS(){addCart($('#posbc').value)}
function qty(i,d){S.cart[i].q+=d;if(S.cart[i].q<=0)S.cart.splice(i,1);render()}
function pay(m){const t=S.cart.reduce((a,c)=>a+c.p.price*c.q,0);S.cart.forEach(c=>c.p.stock=Math.max(0,c.p.stock-c.q));S.today+=t;S.cart=[];render();toast(`تم الدفع ${m}: ${SAR(t)} · طُبع الإيصال`)}
function lookup(){const p=findBC($('#rbc').value);$('#rname').textContent=p?p.name:'—';$('#rname').className=p?'':'muted'}
function receive(){const p=findBC($('#rbc').value);if(!p){toast('امسح باركودًا صحيحًا أولًا');return}const q=+$('#rq').value||0;p.stock+=q;const e=$('#rexp').value;if(e&&daysTo(e)>daysTo(p.exp)&&daysTo(p.exp)<0)p.exp=e;else if(e&&daysTo(p.exp)>daysTo(e))p.exp=e;render();toast(`أُضيف ${N(q)} من ${p.name}`)}
function act(bc,a){const p=findBC(bc);if(a==='waste'){p.stock=0;toast('سُجّل تالفًا وأُنشئ قيد الهدر')}else{S.discounted[bc]=1;toast('طُبّق الخصم وأُبلغ العملاء المهتمون في التطبيق')}render()}
function adv(id){const o=S.orders.find(o=>o.id===id);o.st++;if(o.st===2)o.eta='18 د';render();toast(`الطلب #${N(id)}: ${ST[o.st]}`)}
function newOrder(){const names=['خالد س.','ريم أ.','عبدالله ن.','هند ق.'];S.orders.unshift({id:S.nextId++,cust:names[S.nextId%4],addr:'حي النرجس، ش '+(S.nextId%25+1),items:5,total:62.5,st:0,eta:'—',pay:'مدى'});render();toast('وصل طلب أونلاين جديد')}
function sendPO(sup){S.pos.push(sup);render();toast(`أُرسل أمر الشراء إلى ${sup}`)}
function ask(q){if(!q||!q.trim())return;const c=$('#chat');let a;
 if(/تخلص|نقص|ينفد|ناقص/.test(q))a='الأصناف تحت نقطة إعادة الطلب: '+low().map(p=>`${p.name} (${N(p.stock)})`).join('، ')+'. جهّزت لك مسودات أوامر الشراء في صفحة المشتريات.';
 else if(/ربح/.test(q)){const r=S.sales.reduce((a,s)=>a+s.v,0);a=`الإيرادات ${SAR(r)}، وصافي الربح التقديري ${SAR(r*0.26-1450)} بعد المصروفات. أفضل يوم كان الجمعة.`}
 else if(/انتهاء|صلاحية|تنتهي/.test(q))a='قريبة الانتهاء: '+expiring().map(p=>`${p.name} (${expState(p)[0]})`).join('، ')+'. أنصح بخصم الزبادي 25٪ وتسجيل الجبن المنتهي تالفًا.';
 else if(/مبيع|أكثر/.test(q))a='الأكثر مبيعًا: خبز التوست (18 يوميًا)، ثم الحليب (14)، ثم الزبادي (9). الخبز والجبن يُشتريان معًا في 64٪ من السلال.';
 else a='في النسخة الكاملة يُرسل السؤال لنموذج لغوي يستعلم بياناتك بصلاحية قراءة فقط. جرّب أحد الأسئلة المقترحة.';
 c.insertAdjacentHTML('beforeend',`<div class="msg u">${q.replace(/</g,'&lt;')}</div><div class="msg a">${a}</div>`);c.scrollTop=c.scrollHeight;const i=$('#q');if(i)i.value=''}

document.getElementById('nav').insertAdjacentHTML('beforeend','<div class="store">فرع حي النرجس · بيانات تجريبية</div>');
const h=location.hash.slice(1);cur=VIEWS[h]?h:'dash';render();
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==cur){cur=h;render()}});
</script>
